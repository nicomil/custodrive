name: OpenHDD
options:
  developmentLanguage: en
  bundleIdPrefix: it.openhdd
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  OpenHDDLocal:
    type: application
    platform: macOS
    sources:
      - path: Sources/OpenHDDApp/OpenHDDApp.swift
      - path: Sources/OpenHDDApp/NTFSCopy.swift
      - path: Sources/OpenHDDApp/NTFSSession.swift
      - path: Sources/OpenHDDApp/LocalBrowser.swift
      - path: Sources/OpenHDDApp/BrowserTable.swift
      - path: Sources/OpenHDDApp/BrowserView.swift
      - path: Sources/OpenHDDApp/UISelfTest.swift
      - path: Sources/OpenHDDApp/ReadmeShots.swift
      - path: Sources/OpenHDDApp/Localization.swift
      - path: Resources/Localization
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Sources/Shared/DiskHelperProtocol.swift
    info:
      path: Sources/OpenHDDApp/InfoLocal.plist
      properties:
        CFBundleDisplayName: Custodrive
        CFBundleName: Custodrive
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Custodrive — verified copies for external disks"
        CFBundleLocalizations: [en, it, es]
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "15.4"
        # Files dropped on the Dock icon are offered for copying.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Files and folders to copy to NTFS
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.folder]
        # Finder: right click > Services. These labels follow the host language.
        NSServices:
          - NSMenuItem:
              default: Copy to NTFS Disk with Custodrive
              en: Copy to NTFS Disk with Custodrive
              it: Copia su disco NTFS con Custodrive
              es: Copiar en disco NTFS con Custodrive
            NSMessage: copyToNTFS
            NSPortName: Custodrive
            NSRequiredContext: {}
            NSSendFileTypes: [public.item, public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.custodrive.mac
        PRODUCT_NAME: Custodrive
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) OPENHDD_LOCAL
    postBuildScripts:
      - name: Embed OpenHDDCopy
        # Every build product must carry the copy engine, not only the
        # bundle assembled by Scripts/build-local-app.sh.
        script: |
          set -eu
          PROJECT_DIR="$PROJECT_DIR" "$PROJECT_DIR/Scripts/build-copy-tool.sh"
          install -d "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          install -m 755 "$PROJECT_DIR/Build/OpenHDDCopy" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/OpenHDDCopy"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/OpenHDDCopy
        basedOnDependencyAnalysis: false
  OpenHDD:
    type: application
    platform: macOS
    sources:
      - path: Sources/OpenHDDApp
      - path: Resources/Localization
        buildPhase: resources
      - path: Sources/Shared/DiskHelperProtocol.swift
      - path: Sources/LaunchDaemons/it.openhdd.app.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Sources/OpenHDDApp/Info.plist
      properties:
        CFBundleDisplayName: OpenHDD
        CFBundleLocalizations: [en, it, es]
        CFBundleShortVersionString: "0.1.0"
        LSMinimumSystemVersion: "15.4"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.openhdd.app
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: OpenHDDNTFS
        embed: true
      - target: OpenHDDHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
  OpenHDDNTFS:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Sources/NTFSExtension
      - path: Sources/NTFSBridge/OpenHDDNTFS.c
      - path: Sources/NTFSBridge/include/OpenHDDNTFS.h
    info:
      path: Sources/NTFSExtension/Info.plist
      properties:
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "0.1.0"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSActivateOptionSyntax: {}
          FSCheckOptionSyntax:
            shortOptions: n
          FSMediaTypes: {}
          FSPersonalities:
            OpenHDDNTFS:
              FSName: OpenHDD NTFS (read-only)
              FSfileObjectsAreCaseSensitive: false
          FSRequiresSecurityScopedPathURLResources: false
          FSShortName: openhdd_ntfs
          FSSupportsBlockResources: true
          FSSupportsGenericURLResources: false
          FSSupportsPathURLs: false
          FSSupportsServerURLs: false
    entitlements:
      path: Sources/NTFSExtension/NTFSExtension.entitlements
      properties:
        com.apple.developer.fskit.fsmodule: true
    dependencies:
      - target: NTFS3GStatic
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.openhdd.app.ntfs
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NTFSBridge/include/OpenHDDNTFS.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Sources/NTFSBridge/include
          - $(PROJECT_DIR)/vendor/ntfs-3g-2026.7.7/include
          - $(PROJECT_DIR)/Build/ntfs3g
        OTHER_LDFLAGS:
          - $(PROJECT_DIR)/Build/ntfs3g/libntfs-3g/.libs/libntfs-3g.a
          - -framework
          - CoreFoundation
  OpenHDDHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/DiskHelper
      - path: Sources/Shared/DiskHelperProtocol.swift
      - path: Sources/NTFSBridge/OpenHDDNTFS.c
      - path: Sources/NTFSBridge/include/OpenHDDNTFS.h
    dependencies:
      - target: NTFS3GStatic
        link: false
    settings:
      base:
        PRODUCT_NAME: OpenHDDHelper
        PRODUCT_BUNDLE_IDENTIFIER: it.openhdd.app.helper
        CODE_SIGNING_ALLOWED: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NTFSBridge/include/OpenHDDNTFS.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Sources/NTFSBridge/include
          - $(PROJECT_DIR)/vendor/ntfs-3g-2026.7.7/include
          - $(PROJECT_DIR)/Build/ntfs3g
        OTHER_LDFLAGS:
          - $(PROJECT_DIR)/Build/ntfs3g/libntfs-3g/.libs/libntfs-3g.a
          - -framework
          - CoreFoundation
  NTFS3GStatic:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/sh
      arguments: $(PROJECT_DIR)/Scripts/build-ntfs3g.sh
      passSettings: true
      workingDirectory: $(PROJECT_DIR)
